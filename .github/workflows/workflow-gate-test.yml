name: Workflow Gate Test

on:
  pull_request:
    paths:
      - 'validation/workflow-gate/**'
      - 'docs/stage-01-02-start-framing/**'
      - 'docs/stage-03-measurement-design/**'
      - 'docs/stage-04-execution-validation/**'
      - '.github/workflows/workflow-gate-test.yml'
  workflow_dispatch:

jobs:
  test-workflow-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - name: Run workflow gate tests
        run: Rscript validation/workflow-gate/test_workflow_gate.R
